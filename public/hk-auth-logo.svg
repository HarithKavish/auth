<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HarithKavish Auth">
  <title>HarithKavish Auth</title>
  <!--
    The HarithKavish Account mark is a keyhole combined with a person: identity.
    Auth takes the keyhole alone — the act of unlocking, without owning the
    account behind it. Same family, different job.
  -->
  <defs>
    <linearGradient id="hk-auth-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fbf"/>
      <stop offset="1" stop-color="#123f50"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#hk-auth-face)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.6"/>

  <!-- Keyhole: bore plus tapered ward. -->
  <circle cx="32" cy="26.5" r="7.5" fill="#ffffff"/>
  <path d="M29.2 32.6h5.6l2.9 12.9a1.6 1.6 0 0 1-1.6 2h-8.2a1.6 1.6 0 0 1-1.6-2Z" fill="#ffffff"/>
</svg>
